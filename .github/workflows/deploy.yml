name: Build and deploy to Hostpoint

# Every push to main builds the site and copies it to Hostpoint.
# It deploys into DEPLOY_PATH only. Switching the live domain to that folder
# is a separate, manual step in the Hostpoint Control Panel.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: python3 build.py

      - name: Check secrets are set
        id: ready
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -n "$KEY" ] && [ -n "$HOST" ]; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "Deploy secrets not set yet: built only."; fi

      - name: Upload to Hostpoint
        if: steps.ready.outputs.ok == 'true'
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          DEST: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          test -n "$DEST"
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" site/ "$USER@$HOST:$DEST/"
          echo "Deployed to $DEST"
