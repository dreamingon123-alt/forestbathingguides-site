name: Build site

# Every push to main builds the site and publishes the finished files to the
# "live" branch. Hostpoint picks up the "live" branch on a schedule (cron job
# in the Hostpoint Control Panel), so no passwords or keys are stored here.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Rebuild every 1 January (00:17 UTC) so the footer year updates on its own.
    - cron: '17 0 1 1 *'

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: python3 build.py

      - name: Publish finished files to the live branch
        run: |
          cd site
          git init -q -b live
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" live
